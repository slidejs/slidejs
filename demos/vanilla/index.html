<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide DSL + Reveal.js Demo</title>
  </head>
  <body>
    <div id="app">
      <!-- 主题切换工具栏 -->
      <div class="theme-toolbar">
        <div class="theme-toolbar-content">
          <span class="theme-label">Theme:</span>
          <button id="theme-dark" class="theme-btn active" type="button" title="Solarized Dark">
            🌙 Dark
          </button>
          <button id="theme-light" class="theme-btn" type="button" title="Solarized Light">
            ☀️ Light
          </button>
        </div>
      </div>

      <!-- 顶部播放器区域 (3/4) -->
      <div class="player-container">
        <div class="runner-column">
          <div class="runner-header">
            <h3>Reveal.js</h3>
          </div>
          <div id="player-reveal"></div>
        </div>
        <div class="runner-column">
          <div class="runner-header">
            <h3>Swiper</h3>
          </div>
          <div id="player-swiper"></div>
        </div>
        <div class="runner-column">
          <div class="runner-header">
            <h3>Splide</h3>
          </div>
          <div id="player-splide"></div>
        </div>
      </div>

      <!-- 底部编辑器区域 (1/4) -->
      <div class="editor-container">
        <!-- 水平分割器 -->
        <div class="splitter-horizontal" id="splitter-h">
          <div class="splitter-handle"></div>
        </div>

        <!-- DSL 编辑器 -->
        <div class="editor-panel">
          <div class="panel-header">
            <h3>DSL Editor</h3>
          </div>
          <div id="dsl-editor" class="editor-content"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
